<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="16" fill="#0a0a0a" stroke="#00ff41" stroke-width="2"/>
  <rect x="12" y="12" width="76" height="76" rx="4" fill="none" stroke="#00ff41" stroke-width="1.5" stroke-opacity="0.3"/>
  
  <!-- Lock icon -->
  <rect x="35" y="45" width="30" height="25" rx="4" fill="none" stroke="#00ff41" stroke-width="2.5"/>
  <path d="M40 45 V35 C40 29.5 44.5 25 50 25 C55.5 25 60 29.5 60 35 V45" fill="none" stroke="#00ff41" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="50" cy="58" r="4" fill="#00ff41" opacity="0.6"/>
  
  <!-- Keyhole -->
  <rect x="48" y="58" width="4" height="6" fill="#00ff41" opacity="0.6" rx="1"/>
  
  <!-- Glow effect -->
  <circle cx="50" cy="50" r="35" fill="none" stroke="#00ff41" stroke-width="0.5" opacity="0.1"/>
  <circle cx="50" cy="50" r="25" fill="none" stroke="#00ff41" stroke-width="0.5" opacity="0.05"/>
  
  <!-- Scanline effect -->
  <line x1="0" y1="30" x2="100" y2="30" stroke="#00ff41" stroke-width="0.5" opacity="0.05"/>
  <line x1="0" y1="70" x2="100" y2="70" stroke="#00ff41" stroke-width="0.5" opacity="0.05"/>
  
  <!-- Terminal cursor -->
  <rect x="30" y="30" width="2" height="10" fill="#00ff41" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0;0.3" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>